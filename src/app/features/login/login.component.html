<main class="login">
  <section class="login__card">
    <div class="login__brand">
      <span class="login__mark">BQ</span>
      <h1>Burger Queen</h1>
      <p>Ingresa con las credenciales que te asignó tu administrador/a.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>
        Correo
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="tu@correo.com"
          [class.is-invalid]="showError('email')"
        />
      </label>
      @if (showError('email')) {
        <p class="field-error">{{ emailError }}</p>
      }

      <label>
        Contraseña
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [class.is-invalid]="showError('password')"
        />
      </label>
      @if (showError('password')) {
        <p class="field-error">Escribe tu contraseña.</p>
      }

      @if (serverError) {
        <p class="alert alert--error" role="alert">{{ serverError }}</p>
      }

      <button class="btn btn--primary btn--block" type="submit" [disabled]="loading">
        {{ loading ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>
  </section>
</main>
